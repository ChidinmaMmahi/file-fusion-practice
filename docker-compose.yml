services:
  frontend:
    image: chidinmammahi/file-fusion-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    image: chidinmammahi/file-fusion-backend:latest
    environment:
      PORT: "3000"
      DATABASE_URL: file:../data/dev.db
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret}
    volumes:
      - backend-data:/app/data
    expose:
      - "3000"

volumes:
  backend-data:
